name: BetterWispr
options:
  bundleIdPrefix: com.adamfrank.betterwispr
  deploymentTarget:
    iOS: '17.0'
packages:
  BetterWisprShared:
    path: Shared
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
    BETTERWISPR_APP_GROUP: group.com.adamfrank.betterwispr
    CODE_SIGN_STYLE: Automatic
targets:
  BetterWispr:
    type: application
    platform: iOS
    sources: [iOS/App]
    dependencies:
      - package: BetterWisprShared
      - target: BetterWisprKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamfrank.betterwispr
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: BetterWispr
        NSMicrophoneUsageDescription: Record audio for your dictations and meeting clips.
        NSSpeechRecognitionUsageDescription: Transcribe your recordings using on-device speech recognition.
        BetterWisprAppGroup: $(BETTERWISPR_APP_GROUP)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportsDocumentBrowser: true
    entitlements:
      path: iOS/App/BetterWispr.entitlements
      properties:
        com.apple.security.application-groups: ['$(BETTERWISPR_APP_GROUP)']
  BetterWisprKeyboard:
    type: app-extension
    platform: iOS
    sources: [iOS/Keyboard]
    dependencies:
      - package: BetterWisprShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamfrank.betterwispr.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: iOS/Keyboard/Info.plist
      properties:
        CFBundleDisplayName: BetterWispr
        BetterWisprAppGroup: $(BETTERWISPR_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: iOS/Keyboard/BetterWispr.entitlements
      properties:
        com.apple.security.application-groups: ['$(BETTERWISPR_APP_GROUP)']
schemes:
  BetterWispr:
    build:
      targets:
        BetterWispr: all
